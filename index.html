<!DOCTYPE html>
<html>
<head>
  <title>Bible Projector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    #control {
      padding: 20px;
      background: #111;
    }

    input {
      padding: 10px;
      font-size: 18px;
      width: 60%;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin-left: 10px;
    }

    #display {
      font-size: 40px;
      padding: 40px;
    }
  </style>
</head>

<body>

<div id="control">
  <input id="verseInput" placeholder="Type John 3:16">
  <button onclick="getVerse()">Display</button>
</div>

<div id="display">
  Your verse will appear here
</div>

<script>
async function getVerse() {
  const ref = document.getElementById("verseInput").value;

  try {
    const res = await fetch(`https://bible-api.com/${ref}`);
    const data = await res.json();

    if (data.text) {
      document.getElementById("display").innerText =
        data.reference + "\n\n" + data.text;
    } else {
      document.getElementById("display").innerText = "Verse not found";
    }

  } catch (error) {
    document.getElementById("display").innerText = "Error fetching verse";
  }
}
</script>

</body>
</html>
