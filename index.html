<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bible Projector AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #control {
      padding: 15px;
      background: #121212;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #222;
    }

    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      background: #1e1e1e;
      color: white;
    }

    input::placeholder {
      color: #666;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      background: #2962ff;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #1e53e5;
    }

    button:disabled {
      background: #666;
      cursor: not-allowed;
    }

    #display {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }

    #box {
      max-width: 900px;
    }

    #reference {
      font-size: 28px;
      color: #90caf9;
      margin-bottom: 20px;
    }

    #text {
      font-size: 40px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .loading {
      display: none;
      font-size: 18px;
      color: #90caf9;
    }

    .loading.active {
      display: block;
    }

    .error {
      color: #ff6b6b;
      font-size: 18px;
      margin-top: 10px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>

<div id="control">
  <label for="verseInput" class="sr-only">Verse reference</label>
  <input id="verseInput" placeholder="John 3:16" autocomplete="off" aria-label="Verse reference">
  <button id="displayBtn" type="button" aria-label="Display verse">Display</button>
  <button id="speakBtn" type="button" aria-label="Speak a verse reference">🎤 Speak</button>
</div>

<div id="display">
  <div id="box" role="region" aria-live="polite">
    <div id="reference">Waiting...</div>
    <div id="text">Your verse will appear here</div>
    <div class="loading" id="loading">Loading verse...</div>
    <div class="error" id="error" role="alert"></div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"></script>

<script>
// ⚠️ The Firebase Web API key is intended to be public, but database
// access must be restricted via Realtime Database security rules so
// that only authorized clients can write to /verse.
const firebaseConfig = {
  apiKey: "AIzaSyCBElewwMWAk42lYzbAx-iuj8FZIV7NErY",
  authDomain: "bible-projector-28521.firebaseapp.com",
  databaseURL: "https://bible-projector-28521-default-rtdb.firebaseio.com",
  projectId: "bible-projector-28521",
  storageBucket: "bible-projector-28521.firebasestorage.app",
  messagingSenderId: "877315273616",
  appId: "1:877315273616:web:62f9aea932b4d643493915"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let verseListener = null;

const els = {
  input: document.getElementById("verseInput"),
  displayBtn: document.getElementById("displayBtn"),
  speakBtn: document.getElementById("speakBtn"),
  reference: document.getElementById("reference"),
  text: document.getElementById("text"),
  loading: document.getElementById("loading"),
  error: document.getElementById("error"),
};

const FETCH_TIMEOUT_MS = 10000;
const SPEECH_TIMEOUT_MS = 10000;

// Longer tokens first so "twenty one" doesn't become "twenty 1".
const NUMBER_WORDS = [
  ["one hundred fifty", 150], ["one hundred forty", 140], ["one hundred thirty", 130],
  ["one hundred twenty", 120], ["one hundred ten", 110], ["one hundred", 100],
  ["ninety", 90], ["eighty", 80], ["seventy", 70], ["sixty", 60], ["fifty", 50],
  ["forty", 40], ["thirty", 30], ["twenty", 20],
  ["nineteen", 19], ["eighteen", 18], ["seventeen", 17], ["sixteen", 16],
  ["fifteen", 15], ["fourteen", 14], ["thirteen", 13], ["twelve", 12], ["eleven", 11],
  ["ten", 10], ["nine", 9], ["eight", 8], ["seven", 7], ["six", 6],
  ["five", 5], ["four", 4], ["three", 3], ["two", 2], ["one", 1],
];

function wordsToNumbers(input) {
  let out = input;
  for (const [word, num] of NUMBER_WORDS) {
    out = out.replace(new RegExp(`\\b${word}\\b`, "g"), String(num));
  }
  // Collapse "20 1" → "21" for compound tens (only when first is a multiple of 10).
  out = out.replace(/\b([2-9])0\s+([1-9])\b/g, (_, tens, ones) => `${tens}${ones}`);
  return out;
}

function titleCase(str) {
  return str.replace(/\b([a-z])([a-z']*)/g, (_, head, tail) => head.toUpperCase() + tail);
}

function normalizeReference(raw) {
  let text = raw.trim().toLowerCase();
  if (!text) return "";
  text = wordsToNumbers(text);
  // "john 3 16" → "john 3:16" (global so "john 3 16 to 18" also normalizes).
  text = text.replace(/(\d+)\s+(\d+)/g, "$1:$2");
  text = text.replace(/\s+/g, " ").trim();
  return titleCase(text);
}

async function getVerse() {
  const ref = els.input.value.trim();

  els.error.innerText = "";

  if (!ref) {
    els.error.innerText = "Please enter a verse reference (e.g., John 3:16)";
    return;
  }

  els.loading.classList.add("active");
  els.displayBtn.disabled = true;
  els.speakBtn.disabled = true;

  try {
    const res = await fetch(
      `https://bible-api.com/${encodeURIComponent(ref)}`,
      { signal: AbortSignal.timeout(FETCH_TIMEOUT_MS) }
    );

    if (!res.ok) {
      els.error.innerText = res.status === 404
        ? "Verse not found. Try a different reference."
        : `Lookup failed (${res.status}). Please try again.`;
      return;
    }

    const data = await res.json();

    if (data.text && data.reference) {
      await db.ref("verse").set({
        ref: data.reference,
        text: data.text,
      });
      els.error.innerText = "";
    } else {
      els.error.innerText = "Verse not found. Try a different reference.";
    }
  } catch (error) {
    els.error.innerText = error.name === "TimeoutError" || error.name === "AbortError"
      ? "Lookup timed out. Please try again."
      : "Error fetching verse. Check your connection and try again.";
    console.error("Fetch error:", error);
  } finally {
    els.loading.classList.remove("active");
    els.displayBtn.disabled = false;
    els.speakBtn.disabled = false;
  }
}

function setupVerseListener() {
  if (verseListener) {
    db.ref("verse").off("value", verseListener);
  }

  verseListener = (snap) => {
    const data = snap.val();
    if (data) {
      els.reference.innerText = data.ref;
      els.text.innerText = data.text;
      els.error.innerText = "";
    }
  };

  db.ref("verse").on("value", verseListener);
}

window.addEventListener("beforeunload", () => {
  if (verseListener) {
    db.ref("verse").off("value", verseListener);
    verseListener = null;
  }
});

setupVerseListener();

function startListening() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    els.error.innerText = "Voice not supported. Please use Chrome, Edge, or Safari.";
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let resolved = false;
  els.reference.innerText = "Listening...";
  els.error.innerText = "";
  els.speakBtn.disabled = true;

  const timeout = setTimeout(() => {
    if (resolved) return;
    resolved = true;
    recognition.abort();
    els.reference.innerText = "Listening timeout";
    els.error.innerText = "Please try again.";
    els.speakBtn.disabled = false;
  }, SPEECH_TIMEOUT_MS);

  recognition.onresult = (event) => {
    if (resolved) return;
    resolved = true;
    clearTimeout(timeout);

    const transcript = event?.results?.[0]?.[0]?.transcript;
    if (!transcript || !transcript.trim()) {
      els.error.innerText = "No speech detected. Please try again.";
      els.reference.innerText = "Waiting...";
      els.speakBtn.disabled = false;
      return;
    }

    const normalized = normalizeReference(transcript);
    els.input.value = normalized;
    els.speakBtn.disabled = false;
    getVerse();
  };

  recognition.onerror = (event) => {
    if (resolved) return;
    resolved = true;
    clearTimeout(timeout);
    els.speakBtn.disabled = false;

    const errorMessages = {
      "no-speech": "No speech detected. Please speak clearly.",
      "audio-capture": "No microphone found.",
      "network": "Network error. Check your connection.",
      "not-allowed": "Microphone permission denied.",
      "aborted": "Listening cancelled.",
    };

    els.error.innerText = errorMessages[event.error] || "Voice recognition failed. Please try again.";
    els.reference.innerText = "Error";
  };

  recognition.onend = () => {
    clearTimeout(timeout);
    els.speakBtn.disabled = false;
    if (!resolved) {
      resolved = true;
      if (els.reference.innerText === "Listening...") {
        els.reference.innerText = "Waiting...";
      }
    }
  };

  try {
    recognition.start();
  } catch (err) {
    clearTimeout(timeout);
    resolved = true;
    els.speakBtn.disabled = false;
    els.reference.innerText = "Error";
    els.error.innerText = "Could not start voice recognition. Please try again.";
    console.error("Speech start error:", err);
  }
}

els.displayBtn.addEventListener("click", getVerse);
els.speakBtn.addEventListener("click", startListening);
els.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    getVerse();
  }
});
</script>

</body>
</html>
